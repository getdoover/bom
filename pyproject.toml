[project]
name = "bom"
version = "0.1.0"
description = "Doover processor recording Bureau of Meteorology data for a location"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydoover>=1.18.2"]

[project.scripts]
export-config = "bom.app_config:export"
export-ui = "bom.app_ui:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bom"]

[dependency-groups]
dev = ["pytest>=8.3.5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
